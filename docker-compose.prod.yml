version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-autoparts_shop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  web:
    build: .
    container_name: Internet-shop-prod
    command: sh -c "chmod +x entrypoint.sh && ./entrypoint.sh && gunicorn DjangoProject.wsgi:application --bind 0.0.0.0:8899 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "127.0.0.1:8443:80"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network

  web:
    build: .
    container_name: Internet-shop-prod
    command: sh -c "chmod +x entrypoint.sh && ./entrypoint.sh && gunicorn DjangoProject.wsgi:application --bind 0.0.0.0:8443 --workers 3 --timeout 30"
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8443:8443"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    networks:
      - app-network

volumes:
  postgres_data_prod:
  static_volume_prod:
  media_volume_prod:

networks:
  app-network:
    driver: bridge
